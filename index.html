<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <title>Peta UMKM Kota Manado</title>
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #map { width: 100%; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; }

        /* TOP HEADER */
        #app-header {
            position: fixed; top: 0; left: 0; right: 0; height: 56px;
            background: linear-gradient(135deg, #1a3a6c, #2563b0);
            color: #fff; display: flex; align-items: center;
            padding: 0 20px; z-index: 1000;
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
        }
        #app-header .logo { font-size: 22px; margin-right: 12px; }
        #app-header h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
        #app-header p { font-size: 12px; opacity: 0.75; }
        #app-header .badge {
            margin-left: auto; background: rgba(255,255,255,0.18);
            border-radius: 20px; padding: 4px 14px;
            font-size: 13px; font-weight: 600;
        }

        /* MAP */
        #map { padding-top: 56px; }

        /* SIDEBAR PANEL (right) */
        #detail-panel {
            position: fixed; top: 56px; right: 0;
            width: 340px; height: calc(100vh - 56px);
            background: #fff; z-index: 900;
            box-shadow: -4px 0 24px rgba(0,0,0,0.13);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(.4,0,.2,1);
            display: flex; flex-direction: column; overflow: hidden;
        }
        #detail-panel.open { transform: translateX(0); }
        #panel-close {
            position: absolute; top: 12px; right: 14px;
            background: rgba(255,255,255,0.2); border: none;
            color: #fff; font-size: 20px; cursor: pointer;
            border-radius: 50%; width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; transition: background 0.2s;
        }
        #panel-close:hover { background: rgba(255,255,255,0.35); }
        #panel-header {
            padding: 22px 20px 16px; color: #fff; position: relative;
            flex-shrink: 0;
        }
        #panel-header .panel-type-badge {
            font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
            text-transform: uppercase; opacity: 0.85;
            background: rgba(255,255,255,0.2); border-radius: 20px;
            padding: 3px 10px; display: inline-block; margin-bottom: 10px;
        }
        #panel-header .panel-icon { font-size: 36px; display: block; margin-bottom: 6px; }
        #panel-header h2 { font-size: 20px; font-weight: 700; line-height: 1.25; }
        #panel-header .panel-sub { font-size: 12px; opacity: 0.8; margin-top: 4px; }
        #panel-body { flex: 1; overflow-y: auto; padding: 16px 20px 24px; }
        .stat-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin: 12px 0;
        }
        .stat-card {
            background: #f4f7fb; border-radius: 12px;
            padding: 14px 12px; text-align: center;
        }
        .stat-card .stat-val {
            font-size: 24px; font-weight: 800; color: #1a3a6c;
        }
        .stat-card .stat-lbl {
            font-size: 11px; color: #888; margin-top: 3px;
        }
        .section-title {
            font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
            color: #aaa; text-transform: uppercase;
            margin: 18px 0 8px;
        }
        .detail-row {
            display: flex; justify-content: space-between;
            align-items: center; padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-row .lbl { color: #888; }
        .detail-row .val { font-weight: 600; color: #222; }
        .type-chip {
            display: inline-block; padding: 5px 14px;
            border-radius: 20px; font-size: 12px; font-weight: 600;
            margin: 4px 4px 0 0;
        }

        /* LEGEND (left bottom) */
        #legend-box {
            position: fixed; left: 12px; bottom: 12px;
            background: #fff; border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 14px 18px; z-index: 800;
            min-width: 160px;
        }
        #legend-box h3 {
            font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
            color: #aaa; text-transform: uppercase; margin-bottom: 10px;
        }
        .legend-item {
            display: flex; align-items: center;
            gap: 10px; margin-bottom: 8px; font-size: 13px;
        }
        .legend-dot {
            width: 22px; height: 22px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.18);
        }

        /* HINT */
        #hint {
            position: fixed; right: 16px; bottom: 16px;
            background: rgba(26,58,108,0.88); color: #fff;
            border-radius: 24px; padding: 8px 18px;
            font-size: 13px; z-index: 800;
            pointer-events: none; backdrop-filter: blur(4px);
        }

        /* OL popup hide */
        .ol-popup { display: none !important; }
        .ol-zoom { top: 72px !important; }
    </style>
</head>
<body>
    <div id="app-header">
        <span class="logo">🏙️</span>
        <div>
            <h1>Peta UMKM Kota Manado</h1>
            <p>Sulawesi Utara, Indonesia</p>
        </div>
        <div class="badge" id="total-badge">59 UMKM</div>
    </div>

    <div id="map">
        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>
    </div>

    <!-- DETAIL PANEL -->
    <div id="detail-panel">
        <div id="panel-header">
            <button id="panel-close">✕</button>
            <span class="panel-icon" id="panel-icon">🏪</span>
            <div class="panel-type-badge" id="panel-type">KIOS</div>
            <h2 id="panel-name">Nama</h2>
            <div class="panel-sub" id="panel-sub"></div>
        </div>
        <div id="panel-body"></div>
    </div>

    <!-- LEGEND -->
    <div id="legend-box">
        <h3>Jenis UMKM</h3>
        <div class="legend-item">
            <div class="legend-dot" style="background:#b648b0;">🏪</div>
            <span>Kios</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background:#2255e0;">🍽️</div>
            <span>Warung</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background:#3a7bd5;">🔧</div>
            <span>Bengkel</span>
        </div>
    </div>

    <div id="hint">👆 Klik titik atau wilayah untuk lihat detail</div>

    <!-- SCRIPTS -->
    <script src="resources/qgis2web_expressions.js"></script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="layers/KotaManado_1.js"></script>
    <script src="layers/Kelurahan_2.js"></script>
    <script src="layers/Kecamatan_3.js"></script>
    <script src="layers/Titik_4.js"></script>
    <script src="layers/Bangunan_5.js"></script>
    <script src="layers/Fasilitas_Ekonomi_6.js"></script>
    <script src="layers/Jalan_Utama_7.js"></script>
    <script src="layers/Info_8.js"></script>
    <script src="styles/KotaManado_1_style.js"></script>
    <script src="styles/Kelurahan_2_style.js"></script>
    <script src="styles/Kecamatan_3_style.js"></script>
    <script src="styles/Bangunan_5_style.js"></script>
    <script src="styles/Fasilitas_Ekonomi_6_style.js"></script>
    <script src="styles/Jalan_Utama_7_style.js"></script>
    <script src="styles/Info_8_style.js"></script>
    <script src="./resources/Autolinker.min.js"></script>

    <script>
    // ===== CUSTOM TITIK STYLE WITH EMOJI PINS =====
    var umkmConfig = {
        'Kios':    { emoji: '🏪', color: '#b648b0', shadow: '#7a1f76' },
        'Warung':  { emoji: '🍽️', color: '#2255e0', shadow: '#0d2eb5' },
        'Bengkel': { emoji: '🔧', color: '#3a7bd5', shadow: '#1a4a8a' }
    };

    var pinCache = {};
    function makePinCanvas(jenis) {
        if (pinCache[jenis]) return pinCache[jenis];
        var cfg = umkmConfig[jenis] || { emoji: '📍', color: '#555', shadow: '#333' };
        var canvas = document.createElement('canvas');
        var w = 40, h = 48;
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        // shadow
        ctx.beginPath();
        ctx.ellipse(w/2, h-4, 7, 3, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fill();
        // circle
        ctx.beginPath();
        ctx.arc(w/2, w/2, w/2-2, 0, Math.PI*2);
        ctx.fillStyle = cfg.color;
        ctx.shadowColor = cfg.shadow;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
        // inner glow
        ctx.beginPath();
        ctx.arc(w/2, w/2-3, w/2-10, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fill();
        // emoji
        ctx.font = '18px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(cfg.emoji, w/2, w/2+1);
        pinCache[jenis] = canvas;
        return canvas;
    }

    var style_Titik_4 = function(feature, resolution) {
        var jenis = feature.get('jenisusaha') || 'Kios';
        var canvas = makePinCanvas(jenis);
        return [new ol.style.Style({
            image: new ol.style.Icon({
                img: canvas,
                imgSize: [40, 48],
                anchor: [0.5, 1],
                anchorXUnits: 'fraction',
                anchorYUnits: 'fraction',
                scale: resolution < 5 ? 1.2 : 1
            })
        })];
    };

    // ===== LAYERS =====
    var lyr_OpenStreetMap_0 = new ol.layer.Tile({
        source: new ol.source.XYZ({
            attributions: ' ',
            url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
        })
    });

    var format_KotaManado_1 = new ol.format.GeoJSON();
    var features_KotaManado_1 = format_KotaManado_1.readFeatures(json_KotaManado_1, {dataProjection:'EPSG:4326',featureProjection:'EPSG:3857'});
    var src_KotaManado_1 = new ol.source.Vector({attributions:' '});
    src_KotaManado_1.addFeatures(features_KotaManado_1);
    var lyr_KotaManado_1 = new ol.layer.Vector({source:src_KotaManado_1, style:style_KotaManado_1, interactive:false});

    var format_Kelurahan_2 = new ol.format.GeoJSON();
    var features_Kelurahan_2 = format_Kelurahan_2.readFeatures(json_Kelurahan_2, {dataProjection:'EPSG:4326',featureProjection:'EPSG:3857'});
    var src_Kelurahan_2 = new ol.source.Vector({attributions:' '});
    src_Kelurahan_2.addFeatures(features_Kelurahan_2);
    var lyr_Kelurahan_2 = new ol.layer.Vector({source:src_Kelurahan_2, style:style_Kelurahan_2, interactive:false});

    var format_Kecamatan_3 = new ol.format.GeoJSON();
    var features_Kecamatan_3 = format_Kecamatan_3.readFeatures(json_Kecamatan_3, {dataProjection:'EPSG:4326',featureProjection:'EPSG:3857'});
    var src_Kecamatan_3 = new ol.source.Vector({attributions:' '});
    src_Kecamatan_3.addFeatures(features_Kecamatan_3);
    var lyr_Kecamatan_3 = new ol.layer.Vector({source:src_Kecamatan_3, style:style_Kecamatan_3, interactive:true});

    var format_Titik_4 = new ol.format.GeoJSON();
    var features_Titik_4 = format_Titik_4.readFeatures(json_Titik_4, {dataProjection:'EPSG:4326',featureProjection:'EPSG:3857'});
    var src_Titik_4 = new ol.source.Vector({attributions:' '});
    src_Titik_4.addFeatures(features_Titik_4);
    var lyr_Titik_4 = new ol.layer.Vector({source:src_Titik_4, style:style_Titik_4, interactive:true, declutter:false});

    var format_Info_8 = new ol.format.GeoJSON();
    var features_Info_8 = format_Info_8.readFeatures(json_Info_8, {dataProjection:'EPSG:4326',featureProjection:'EPSG:3857'});
    var src_Info_8 = new ol.source.Vector({attributions:' '});
    src_Info_8.addFeatures(features_Info_8);
    var lyr_Info_8 = new ol.layer.Vector({source:src_Info_8, style:style_Info_8, interactive:true, opacity:0});

    var map = new ol.Map({
        target: 'map',
        renderer: 'canvas',
        layers: [lyr_OpenStreetMap_0, lyr_KotaManado_1, lyr_Kelurahan_2, lyr_Kecamatan_3, lyr_Titik_4, lyr_Info_8],
        view: new ol.View({ maxZoom:28, minZoom:1 })
    });
    map.getView().fit([13891823.533604,161148.160461,13913777.205052,174477.489826], map.getSize());
    map.getView().setProperties({constrainResolution:true});

    // ===== INFO DATA (jumlah UMKM per kecamatan) =====
    var infoByKec = {};
    features_Info_8.forEach(function(f) {
        var nm = f.get('nm_kecamat');
        if (nm) infoByKec[nm] = {
            jumlah_umkm: f.get('jumlah_umkm') || 0,
            nm_kelurah_count: f.get('nm_kelurah_count') || 0
        };
    });

    // ===== PANEL =====
    var panel = document.getElementById('detail-panel');
    var panelIcon = document.getElementById('panel-icon');
    var panelType = document.getElementById('panel-type');
    var panelName = document.getElementById('panel-name');
    var panelSub  = document.getElementById('panel-sub');
    var panelBody = document.getElementById('panel-body');

    var kecColors = {
        'Bunaken':'#92df40','Bunaken Kepulauan':'#ab77e5','Malalayang':'#53cdc9',
        'Mapanget':'#ed6b6f','Paal Dua':'#3c91db','Sario':'#373dec',
        'Singkil':'#d27723','Tikala':'#e48bba','Tuminiting':'#72d7a3',
        'Wanea':'#3ae937','Wenang':'#e1df5b'
    };

    function openUmkmPanel(name, jenis) {
        var cfg = umkmConfig[jenis] || {emoji:'📍', color:'#555'};
        panel.style.background = '#fff';
        panelIcon.textContent = cfg.emoji;
        panelType.textContent = jenis.toUpperCase();
        panelName.textContent = name;
        panelSub.textContent = 'Kota Manado, Sulawesi Utara';
        document.getElementById('panel-header').style.background =
            'linear-gradient(135deg,' + cfg.color + ',' + (umkmConfig[jenis]||{shadow:cfg.color}).shadow + ')';
        panelBody.innerHTML =
            '<div class="section-title">Informasi Usaha</div>' +
            '<div class="detail-row"><span class="lbl">Nama Usaha</span><span class="val">' + name + '</span></div>' +
            '<div class="detail-row"><span class="lbl">Jenis Usaha</span><span class="val">' +
                '<span class="type-chip" style="background:' + cfg.color + '20;color:' + cfg.color + ';">' + jenis + '</span>' +
            '</span></div>' +
            '<div class="detail-row"><span class="lbl">Lokasi</span><span class="val">Kota Manado</span></div>';
        panel.classList.add('open');
    }

    function openKecPanel(nm, kd) {
        var info = infoByKec[nm] || {};
        var color = kecColors[nm] || '#1a6fc4';
        panelIcon.textContent = '🗺️';
        panelType.textContent = 'KECAMATAN';
        panelName.textContent = nm;
        panelSub.textContent = 'Kota Manado';
        document.getElementById('panel-header').style.background =
            'linear-gradient(135deg,' + color + 'cc, ' + color + ')';
        panelBody.innerHTML =
            '<div class="section-title">Statistik Wilayah</div>' +
            '<div class="stat-grid">' +
                '<div class="stat-card"><div class="stat-val">' + (info.jumlah_umkm||0) + '</div><div class="stat-lbl">Jumlah UMKM</div></div>' +
                '<div class="stat-card"><div class="stat-val">' + (info.nm_kelurah_count||0) + '</div><div class="stat-lbl">Kelurahan</div></div>' +
            '</div>' +
            '<div class="section-title">Informasi</div>' +
            '<div class="detail-row"><span class="lbl">Nama Kecamatan</span><span class="val">' + nm + '</span></div>' +
            '<div class="detail-row"><span class="lbl">Kode</span><span class="val">' + (kd||'-') + '</span></div>' +
            '<div class="detail-row"><span class="lbl">Kota</span><span class="val">Manado</span></div>';
        panel.classList.add('open');
    }

    document.getElementById('panel-close').onclick = function() {
        panel.classList.remove('open');
    };

    // ===== CLICK HANDLER =====
    map.on('singleclick', function(evt) {
        var hit = false;
        map.forEachFeatureAtPixel(evt.pixel, function(feature, layer) {
            if (hit) return;
            if (layer === lyr_Titik_4) {
                hit = true;
                openUmkmPanel(feature.get('name')||'Tanpa Nama', feature.get('jenisusaha')||'Kios');
            } else if (layer === lyr_Kecamatan_3 || layer === lyr_Info_8) {
                hit = true;
                openKecPanel(feature.get('nm_kecamat')||'', feature.get('kd_kecamat')||'');
            }
        }, { hitTolerance: 6 });
        if (!hit) panel.classList.remove('open');
    });

    // cursor
    map.on('pointermove', function(evt) {
        var has = map.hasFeatureAtPixel(evt.pixel, {
            layerFilter: function(l) { return l===lyr_Titik_4||l===lyr_Kecamatan_3; }
        });
        map.getViewport().style.cursor = has ? 'pointer' : '';
    });
    </script>
</body>
</html>
